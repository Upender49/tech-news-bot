name: GATE CSE Personal Teacher

on:
  # ── Scheduled trigger: every 3 hours ──────────────────────────────────────
  schedule:
    - cron: "0 */3 * * *"   # At minute 0 every 3rd hour (UTC)

  # ── Manual trigger from the GitHub UI ─────────────────────────────────────
  workflow_dispatch:

# Allow the workflow to commit gate_state.json back to the repo
permissions:
  contents: write

jobs:
  send-gate-session:
    name: Generate & Send GATE Session
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      LOG_LEVEL:          INFO

    steps:
      # 1. Checkout the repository (full history for clean push-back)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Generate and send GATE CSE learning session
      - name: Run GATE teacher bot
        run: python main.py

      # 5. Commit gate_state.json back so next run rotates topics and tracks syllabus progress
      #    [skip ci] prevents this push from triggering another workflow run
      - name: Save GATE learning progress
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gate_state.json
          git diff --staged --quiet || git commit -m "chore: update GATE learning state [skip ci]"
          git push

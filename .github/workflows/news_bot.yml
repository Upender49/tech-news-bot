name: Aptitude Master Bot — Placement & GATE Aptitude Teacher

on:
  # Every 3 hours, 24/7 (UTC times: 0:00, 3:00, 6:00, 9:00, 12:00, 15:00, 18:00, 21:00)
  schedule:
    - cron: "0 */3 * * *"

  # Manual trigger from GitHub Actions UI for testing
  workflow_dispatch:

# Allow workflow to commit aptitude_state.json back to repo
permissions:
  contents: write

jobs:
  send-aptitude-session:
    name: 🎓 Generate & Send Aptitude Session
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT_MODE:           aptitude
      LOG_LEVEL:          INFO
      QUESTIONS_PER_SESSION: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Run Unit & Integrity Tests
        run: python test_aptitude.py

      - name: 🚀 Run Aptitude Teacher Bot
        run: python main.py

      - name: 💾 Save learning progress to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aptitude_state.json
          git diff --staged --quiet || git commit -m "chore: update aptitude learning state [skip ci]"
          git push
